[package]
name = "sigmaos-devtools"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
authors = ["SigmaOS Contributors"]
description = "SigmaOS component: sigmaos-devtools"
repository = "https://github.com/AaryanSinghChauhan09/SigmaOS-devtools"
license = "Apache-2.0"
keywords = ["sigmaos", "os", "systems"]
categories = ["os"]
publish = false

[lib]
name = "sigmaos_devtools"
path = "src/lib.rs"
crate-type = ["rlib"]

[dependencies]
thiserror = "1.0"
log = "0.4"

[dev-dependencies]
tempfile = "3"